name: finance_app
description: แอปบันทึกบัญชีรายรับ-รายจ่าย และพอร์ตการลงทุน (สร้างจากโน้ตออกแบบ)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/images/income_icon.jpg
    - assets/images/bonus_icon.jpg
    - assets/images/scholarship_icon.jpg
    - assets/images/overtime_icon.jpg
    - assets/images/gift_money_icon.jpg
    - assets/images/transfer_icon.jpg
    - assets/images/expenses_icon.jpg    
    - assets/images/investment_icon.jpg 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true